    <style>

      body {

      .content {

      .logo-wrap {

      .brand-name {

      .eyebrow {

      }

      .cta {

        align-items: center;
        justify-content: center;
        gap: 13px;
        padding: 16px 22px;
        border: 2px solid #b51e64;

        color: #fffdfd;
        font: inherit;
        font-size: 1rem;
        font-weight: 700;
        line-height: 1.25;
        text-align: center;
        text-decoration: none;
        transition:

          color 160ms ease,
          transform 160ms ease;
        animation: rise-in 650ms 350ms ease-out both;
      }

      .cta:hover {
        transform: translateY(-2px);
        background: #fffdfd;
        color: #b51e64;
      }

      .cta:focus-visible {
        outline: 3px solid #8e1a53;
        outline-offset: 5px;
      }

      .cta svg {
        width: 21px;
        height: 21px;
        flex: 0 0 auto;
        transition: transform 160ms ease;
      }

      .cta:hover svg {
        transform: translateX(4px);
      }

      .note {
        margin: 14px 0 0;
        color: #806b77;
        font-size: 0.82rem;
        line-height: 1.5;
        animation: rise-in 650ms 410ms ease-out both;
      }

      .visual {
        position: relative;
        display: grid;
        place-items: center;
        min-width: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 52% 42%, #fffdfd 0 14%, transparent 14.2%),
          radial-gradient(circle at 52% 42%, #f6d8e5 0 42%, transparent 42.2%),
          #fae5ef;
      }

      .visual::before,
      .visual::after {
        position: absolute;
        top: 50%;
        left: 52%;
        width: min(78%, 500px);
        aspect-ratio: 1;
        border: 1px solid #e6c6d4;
        border-radius: 50%;
        content: "";
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      .visual::after {
        width: min(63%, 400px);
        border-style: dashed;
        border-color: #dcb5c7;
      }

      .scene {
        position: relative;
        z-index: 1;
        width: min(100%, 610px);
        overflow: visible;
      }

      .scene svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }

      .flight-path {
        fill: none;
        stroke: #c34178;
        stroke-dasharray: 3 11;
        stroke-linecap: round;
        stroke-width: 3;
        animation: route-flow 12s linear infinite;
      }

      .plane {
        pointer-events: none;
      }

      @keyframes arrive {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes rise-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes route-flow {
        to { stroke-dashoffset: -56; }
      }

      @media (max-width: 760px) {
        body {

        .landing {

        .logo-wrap {

        }

        .logo {

        }

        .eyebrow {

      @media (max-width: 380px) {

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation: none !important;
          transition: none !important;
        }
      }

    <script>
      (() => {
        const route = document.getElementById("flight-route");
        const plane = document.getElementById("plane");
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
        const routeLength = route.getTotalLength();
        const sampleLength = 2;
        const travelDuration = 5600;
        const turnDuration = 420;
        const cycleDuration = travelDuration * 2 + turnDuration * 2;
        let startTime = null;
        let frame = null;

        const clampDistance = (distance) => Math.max(0, Math.min(routeLength, distance));

        const angleAt = (distance, direction) => {
          const before = route.getPointAtLength(
            clampDistance(distance - direction * sampleLength),
          );
          const after = route.getPointAtLength(
            clampDistance(distance + direction * sampleLength),
          );
          return Math.atan2(after.y - before.y, after.x - before.x) * (180 / Math.PI);
        };

        const angleBetween = (from, to, progress) => {
          const difference = ((to - from + 540) % 360) - 180;
          return from + difference * progress;
        };

        const placePlane = (distance, direction, angle) => {
          const point = route.getPointAtLength(clampDistance(distance));
          const rotation = angle ?? angleAt(distance, direction);
          plane.setAttribute(
            "transform",
            `translate(${point.x} ${point.y}) rotate(${rotation}) translate(-12 -17) rotate(28)`,
          );
        };

        const animate = (timestamp) => {
          if (startTime === null) startTime = timestamp;
          const elapsed = (timestamp - startTime) % cycleDuration;
          const turnAtDestination = travelDuration;
          const returnAt = turnAtDestination + turnDuration;
          const turnAtStart = returnAt + travelDuration;

          if (elapsed < turnAtDestination) {
            const progress = elapsed / travelDuration;
            placePlane(routeLength * progress, 1);
          } else if (elapsed < returnAt) {
            const progress = (elapsed - turnAtDestination) / turnDuration;
            placePlane(
              routeLength,
              1,
              angleBetween(angleAt(routeLength, 1), angleAt(routeLength, -1), progress),
            );
          } else if (elapsed < turnAtStart) {
            const progress = (elapsed - returnAt) / travelDuration;
            placePlane(routeLength * (1 - progress), -1);
          } else {
            const progress = (elapsed - turnAtStart) / turnDuration;
            placePlane(
              0,
              1,
              angleBetween(angleAt(0, -1), angleAt(0, 1), progress),
            );
          }

          frame = window.requestAnimationFrame(animate);
        };

        const syncMotion = () => {
          if (frame !== null) window.cancelAnimationFrame(frame);
          frame = null;
          startTime = null;

          if (reducedMotion.matches) {
            placePlane(0, 1);
          } else {
            frame = window.requestAnimationFrame(animate);
          }
        };

        syncMotion();
        reducedMotion.addEventListener("change", syncMotion);
      })();
    </script>
